<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25F4EE"/>
      <stop offset="100%" style="stop-color:#FE2C55"/>
    </linearGradient>
  </defs>

  <!-- Lightning bolt circle -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#25F4EE" stroke-width="3"/>
  <polygon points="55,18 40,65 58,65 48,102 80,52 62,52 72,18" fill="url(#brandGrad)"/>

  <!-- TikProfitPro text (single continuous wordmark) -->
  <text x="130" y="55" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="40" letter-spacing="0">
    <tspan fill="#ffffff">Tik</tspan><tspan fill="#25F4EE">Profit</tspan><tspan fill="#FE2C55">Pro</tspan>
  </text>

  <!-- Subtitle -->
  <text x="130" y="82" font-family="Arial, sans-serif" font-weight="600" font-size="13" fill="#25F4EE" letter-spacing="3">TIKTOK SHOP INTELLIGENCE</text>
  <line x1="130" y1="90" x2="420" y2="90" stroke="url(#brandGrad)" stroke-width="2"/>
</svg>
